# Dependabot version updates for EdgeBoard.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Minor and patch bumps for all packages arrive together in one PR.
      # Major bumps match no group, so each one gets its own PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
